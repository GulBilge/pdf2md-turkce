[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF dosyalarını temiz Markdown dosyalarına çevirir — Bilge Gül Koç"
authors = [
    { name = "Bilge Gül Koç" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.131.0",
    "easyocr>=1.7.2",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.pytest.ini_options]
markers = ["yavas: gerçek Docling dönüşümü yapan yavaş testler"]
